<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint — Offline Travel Engine</title>

<!-- Front-End CDN Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
  :root {
    --ink: #070a12;
    --paper: #0e1526;
    --glass: rgba(22, 32, 54, 0.75);
    --glass-border: rgba(255, 255, 255, 0.12);
    --forest: #10b981;
    --forest-glow: rgba(16, 185, 129, 0.4);
    --brass: #f59e0b;
    --rust: #ef4444;
    --cyan: #06b6d4;
    --violet: #8b5cf6;
    --text: #f8fafc;
    --text-soft: #94a3b8;
    --line: #1e293b;
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--ink);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    overflow-x: hidden;
  }

  #fx-canvas {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: 0;
    pointer-events: none;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 16px;
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
  }

  .brand h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(to right, #fff, var(--text-soft));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  nav {
    display: flex;
    gap: 6px;
    background: rgba(14, 21, 38, 0.8);
    padding: 4px;
    border-radius: 12px;
    border: 1px solid var(--glass-border);
  }

  nav button {
    background: transparent;
    color: var(--text-soft);
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
  }

  nav button.active {
    color: #fff;
    background: linear-gradient(135deg, var(--cyan), #0891b2);
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
  }

  main {
    flex: 1;
    margin-top: 28px;
  }

  .page {
    display: none;
    opacity: 0;
  }

  .page.active {
    display: block;
    opacity: 1;
  }

  .search-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    background: var(--glass);
    padding: 8px 8px 8px 18px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
  }

  .search-bar input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 16px;
    outline: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
  }

  .card {
    background: var(--glass);
    border: 2px solid var(--glass-border);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    transition: all 0.3s ease;
    cursor: pointer;
  }

  .card:hover {
    border-color: rgba(6, 182, 212, 0.5);
  }

  .card.selected {
    border-color: var(--cyan);
    box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
    transform: scale(1.02);
  }

  .card-img {
    height: 180px;
    width: 100%;
    object-fit: cover;
  }

  .card-body {
    padding: 20px;
  }

  .card-body h3 {
    font-size: 18px;
    margin-bottom: 8px;
    color: #fff;
  }

  .card-body p {
    font-size: 13px;
    color: var(--text-soft);
    line-height: 1.5;
    margin-bottom: 12px;
  }

  .selection-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-soft);
    margin-top: 8px;
  }

  .card.selected .selection-indicator {
    color: var(--cyan);
  }

  /* Action Dock at the bottom for proceeding after selection */
  .selection-dock {
    position: sticky;
    bottom: 20px;
    margin-top: 24px;
    background: rgba(14, 21, 38, 0.95);
    backdrop-filter: blur(16px);
    border: 1px solid var(--cyan);
    box-shadow: 0 10px 30px rgba(6, 182, 212, 0.3);
    border-radius: var(--radius);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transform: translateY(120%);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 90;
  }

  .selection-dock.active {
    transform: translateY(0);
  }

  .btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s ease;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--cyan), #0891b2);
    color: #fff;
    box-shadow: 0 4px 12px rgba(6, 182, 212, 0.4);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(6, 182, 212, 0.6);
  }

  .layout-two-col {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
  }

  .panel {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-soft);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .field input, .field select {
    width: 100%;
    background: rgba(14, 21, 38, 0.9);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
  }

  .stop-item {
    background: rgba(14, 21, 38, 0.6);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  @media(max-width: 768px) {
    .layout-two-col { grid-template-columns: 1fr; }
    header { flex-direction: column; gap: 16px; }
  }
</style>
</head>
<body>

<canvas id="fx-canvas"></canvas>

<div class="app">
  
  <header>
    <div class="brand">
      <div class="brand-icon"><i data-lucide="compass" style="color: #fff;"></i></div>
      <div>
        <h1>Waypoint</h1>
        <p style="font-size: 11px; color: var(--text-soft);">Offline Travel Engine</p>
      </div>
    </div>

    <nav>
      <button id="nav-home" class="active" onclick="showPage('home')">
        <i data-lucide="map-pin"></i> Explore
      </button>
      <button id="nav-plan" onclick="showPage('plan')">
        <i data-lucide="calendar"></i> Plan
      </button>
      <button id="nav-budget" onclick="showPage('budget')">
        <i data-lucide="wallet"></i> Budget
      </button>
    </nav>
  </header>

  <main>

    <!-- EXPLORE PAGE -->
    <section id="page-home" class="page active">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search or add any place..." onkeypress="if(event.key==='Enter') doSearch()">
        <button class="btn btn-primary" style="width:auto; padding: 0 24px;" onclick="doSearch()">Search</button>
      </div>

      <div class="grid" id="destinations-grid"></div>

      <!-- Action Dock (appears when a destination is clicked) -->
      <div class="selection-dock" id="dock">
        <div>
          <span style="font-size: 12px; color: var(--text-soft); display: block;">Selected Destination:</span>
          <strong id="dock-title" style="font-size: 16px; color: #fff;">None</strong>
        </div>
        <button class="btn btn-primary" onclick="proceedToPlan()">
          Proceed to Plan <i data-lucide="arrow-right"></i>
        </button>
      </div>
    </section>

    <!-- PLAN PAGE -->
    <section id="page-plan" class="page">
      <div class="layout-two-col">
        <div class="panel">
          <h2 style="margin-bottom: 20px; font-size: 18px;"><i data-lucide="plus-circle" style="color:var(--forest);"></i> Add Activity</h2>
          <div class="field">
            <label>Day</label>
            <select id="stop-day">
              <option value="Day 1">Day 1</option>
              <option value="Day 2">Day 2</option>
              <option value="Day 3">Day 3</option>
            </select>
          </div>
          <div class="field">
            <label>Time</label>
            <input type="time" id="stop-time" value="09:00">
          </div>
          <div class="field">
            <label>Location / Activity</label>
            <input type="text" id="stop-name" placeholder="e.g. Visit Museum">
          </div>
          <button class="btn btn-primary" style="width:100%;" onclick="addStop()"><i data-lucide="plus"></i> Add Stop</button>
        </div>

        <div class="panel" id="itinerary-display"></div>
      </div>
    </section>

    <!-- BUDGET PAGE -->
    <section id="page-budget" class="page">
      <div class="panel" style="max-width: 550px; margin: 0 auto;">
        <h2 style="margin-bottom: 20px;">Expense Calculator</h2>
        <div class="field">
          <label>Total Allocated Budget ($)</label>
          <input type="number" id="total-budget" value="1000" oninput="recalcBudget()">
        </div>
        <div id="budget-fields"></div>
        <div style="margin-top: 24px; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 12px;">
          <div style="display: flex; justify-content: space-between; font-weight: 700;">
            <span>Estimated Total:</span>
            <span id="spend-total" style="color: var(--cyan);">$0</span>
          </div>
          <div style="height: 8px; background: var(--line); border-radius: 4px; margin-top: 12px; overflow: hidden;">
            <div id="budget-progress" style="height: 100%; width: 0%; background: var(--forest); transition: width 0.3s ease;"></div>
          </div>
        </div>
      </div>
    </section>

  </main>
</div>

<script>
  // Built-in offline destination catalog (No APIs needed)
  let places = [
    { id: 1, name: "Tokyo, Japan", desc: "Futuristic skyscrapers, historic shrines, and world-renowned street food.", img: "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=600&q=80" },
    { id: 2, name: "Rome, Italy", desc: "Ancient ruins, Colosseum, vibrant street life, and authentic gelato.", img: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=600&q=80" },
    { id: 3, name: "Maui, Hawaii", desc: "Volcanic beaches, ocean whale watching, and scenic coastal highways.", img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" },
    { id: 4, name: "Swiss Alps, Switzerland", desc: "Breathtaking alpine mountain peaks, world-class skiing, and railways.", img: "https://images.unsplash.com/photo-1530122037265-a5f1f91d3b99?auto=format&fit=crop&w=600&q=80" }
  ];

  let selectedPlace = null;
  let itinerary = { "Day 1": [], "Day 2": [], "Day 3": [] };
  let budgetCategories = { Transport: 250, Lodging: 400, Food: 150, Activities: 100 };

  // Canvas particle background setup
  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d');
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let particles = Array.from({length: 30}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2 + 1,
    dx: (Math.random() - 0.5) * 0.4,
    dy: (Math.random() - 0.5) * 0.4
  }));

  function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(6, 182, 212, 0.25)";
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      p.x += p.dx; p.y += p.dy;
      if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
    });
    requestAnimationFrame(drawParticles);
  }
  drawParticles();

  function showPage(pageId) {
    const pages = document.querySelectorAll('.page');
    pages.forEach(p => {
      p.classList.remove('active');
      p.style.opacity = 0;
    });

    const target = document.getElementById(`page-${pageId}`);
    target.classList.add('active');
    
    gsap.fromTo(target, { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.35 });

    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(`nav-${pageId}`).classList.add('active');
  }

  function renderCards() {
    const grid = document.getElementById('destinations-grid');
    let cards = '';

    places.forEach(item => {
      const isSelected = selectedPlace && selectedPlace.id === item.id;
      cards += `
        <div class="card ${isSelected ? 'selected' : ''}" onclick="selectCard(${item.id})">
          <img class="card-img" src="${item.img}" alt="${item.name}">
          <div class="card-body">
            <h3>${item.name}</h3>
            <p>${item.desc}</p>
            <div class="selection-indicator">
              <i data-lucide="${isSelected ? 'check-circle-2' : 'circle'}"></i>
              <span>${isSelected ? 'Selected' : 'Click to select'}</span>
            </div>
          </div>
        </div>
      `;
    });

    grid.innerHTML = cards;
    lucide.createIcons();
  }

  // 1. First step: Click a place card to highlight it
  function selectCard(id) {
    selectedPlace = places.find(p => p.id === id);
    renderCards();

    // Show action dock at the bottom
    const dock = document.getElementById('dock');
    document.getElementById('dock-title').textContent = selectedPlace.name;
    dock.classList.add('active');
  }

  // 2. Second step: Click button in action dock to navigate to Plan screen
  function proceedToPlan() {
    if (!selectedPlace) return;
    
    // Add default arrival item for selected place
    itinerary["Day 1"].unshift({ time: "09:00", name: `Arrive in ${selectedPlace.name}` });
    
    showPage('plan');
    renderItinerary();
    confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
  }

  function doSearch() {
    const val = document.getElementById('search-input').value.trim();
    if (!val) return;
    
    const newPlace = {
      id: Date.now(),
      name: val,
      desc: "Custom added destination ready to be explored.",
      img: "https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=600&q=80"
    };

    places.unshift(newPlace);
    document.getElementById('search-input').value = '';
    selectCard(newPlace.id);
  }

  function addStop() {
    const day = document.getElementById('stop-day').value;
    const time = document.getElementById('stop-time').value;
    const name = document.getElementById('stop-name').value.trim();

    if (!name) return;
    itinerary[day].push({ time, name });
    document.getElementById('stop-name').value = '';
    renderItinerary();
    confetti({ particleCount: 30, spread: 40, origin: { y: 0.8 } });
  }

  function renderItinerary() {
    const container = document.getElementById('itinerary-display');
    let html = '<h2 style="margin-bottom:20px;">Itinerary Schedule</h2>';

    for (const [day, stops] of Object.entries(itinerary)) {
      html += `<h3 style="color:var(--cyan); margin: 16px 0 8px 0;">${day}</h3>`;
      if (stops.length === 0) {
        html += `<p style="font-size:12px; color:var(--text-soft);">No activities planned.</p>`;
      } else {
        stops.forEach((s, idx) => {
          html += `
            <div class="stop-item">
              <div>
                <strong style="color:var(--brass); margin-right:8px;">${s.time}</strong>
                <span>${s.name}</span>
              </div>
              <i data-lucide="trash-2" style="cursor:pointer; color:var(--rust); width:16px;" onclick="removeStop('${day}', ${idx})"></i>
            </div>
          `;
        });
      }
    }
    container.innerHTML = html;
    lucide.createIcons();
  }

  function removeStop(day, idx) {
    itinerary[day].splice(idx, 1);
    renderItinerary();
  }

  function initBudget() {
    const container = document.getElementById('budget-fields');
    let html = '';
    for (const [cat, val] of Object.entries(budgetCategories)) {
      html += `
        <div class="field">
          <label>${cat} ($)</label>
          <input type="number" class="b-input" value="${val}" oninput="recalcBudget()">
        </div>
      `;
    }
    container.innerHTML = html;
    recalcBudget();
  }

  function recalcBudget() {
    let total = 0;
    document.querySelectorAll('.b-input').forEach(i => total += parseFloat(i.value) || 0);
    const limit = parseFloat(document.getElementById('total-budget').value) || 1;

    document.getElementById('spend-total').textContent = `$${total}`;
    const pct = Math.min((total / limit) * 100, 100);
    const bar = document.getElementById('budget-progress');
    bar.style.width = `${pct}%`;
    bar.style.background = total > limit ? 'var(--rust)' : 'var(--forest)';
  }

  window.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    renderCards();
    renderItinerary();
    initBudget();
  });
</script>
</body>
</html>
