<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint — Pure Front-End Travel Engine</title>

<!-- Front-End CDN Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
  :root {
    --ink: #070a12;
    --paper: #0e1526;
    --glass: rgba(22, 32, 54, 0.75);
    --glass-border: rgba(255, 255, 255, 0.12);
    --forest: #10b981;
    --forest-glow: rgba(16, 185, 129, 0.4);
    --brass: #f59e0b;
    --rust: #ef4444;
    --cyan: #06b6d4;
    --violet: #8b5cf6;
    --text: #f8fafc;
    --text-soft: #94a3b8;
    --line: #1e293b;
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--ink);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    overflow-x: hidden;
  }

  #fx-canvas {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: 0;
    pointer-events: none;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 16px;
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
  }

  .brand h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(to right, #fff, var(--text-soft));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  nav {
    display: flex;
    gap: 6px;
    background: rgba(14, 21, 38, 0.8);
    padding: 4px;
    border-radius: 12px;
    border: 1px solid var(--glass-border);
  }

  nav button {
    background: transparent;
    color: var(--text-soft);
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
  }

  nav button.active {
    color: #fff;
    background: linear-gradient(135deg, var(--cyan), #0891b2);
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
  }

  .api-btn {
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid var(--brass);
    color: var(--brass);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s ease;
  }

  .api-btn:hover {
    background: var(--brass);
    color: var(--ink);
  }

  main {
    flex: 1;
    margin-top: 28px;
  }

  .page {
    display: none;
    opacity: 0;
  }

  .page.active {
    display: block;
    opacity: 1;
  }

  .search-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    background: var(--glass);
    padding: 8px 8px 8px 18px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
  }

  .search-bar input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 16px;
    outline: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
  }

  .card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    transition: border-color 0.3s ease, transform 0.2s ease;
    transform-style: preserve-3d;
  }

  .card:hover {
    border-color: var(--cyan);
  }

  .card-img {
    height: 180px;
    width: 100%;
    object-fit: cover;
  }

  .card-body {
    padding: 20px;
  }

  .card-body h3 {
    font-size: 18px;
    margin-bottom: 8px;
    color: #fff;
  }

  .card-body p {
    font-size: 13px;
    color: var(--text-soft);
    line-height: 1.5;
    margin-bottom: 16px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s ease;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--forest), #059669);
    color: #fff;
    box-shadow: 0 4px 12px var(--forest-glow);
    width: 100%;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px var(--forest-glow);
  }

  .layout-two-col {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
  }

  .panel {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-soft);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .field input, .field select {
    width: 100%;
    background: rgba(14, 21, 38, 0.9);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
  }

  .stop-item {
    background: rgba(14, 21, 38, 0.6);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .modal.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-card {
    background: var(--paper);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    width: 90%;
    max-width: 480px;
    padding: 28px;
  }

  @media(max-width: 768px) {
    .layout-two-col { grid-template-columns: 1fr; }
    header { flex-direction: column; gap: 16px; }
  }
</style>
</head>
<body>

<canvas id="fx-canvas"></canvas>

<div class="app">
  
  <header>
    <div class="brand">
      <div class="brand-icon"><i data-lucide="compass" style="color: #fff;"></i></div>
      <div>
        <h1>Waypoint</h1>
        <p style="font-size: 11px; color: var(--text-soft);">Pure Front-End Engine</p>
      </div>
    </div>

    <nav>
      <button id="nav-home" class="active" onclick="showPage('home')">
        <i data-lucide="map-pin"></i> Explore
      </button>
      <button id="nav-plan" onclick="showPage('plan')">
        <i data-lucide="calendar"></i> Plan
      </button>
      <button id="nav-budget" onclick="showPage('budget')">
        <i data-lucide="wallet"></i> Budget
      </button>
    </nav>

    <div class="api-btn" onclick="openApiModal()">
      <i data-lucide="key"></i> <span id="api-status">API Keys</span>
    </div>
  </header>

  <main>

    <!-- EXPLORE PAGE -->
    <section id="page-home" class="page active">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search any place on Earth (OpenAI / Wiki Fetch)..." onkeypress="if(event.key==='Enter') doSearch()">
        <button class="btn btn-primary" style="width:auto; padding: 0 24px;" onclick="doSearch()">Search</button>
      </div>

      <div class="grid" id="destinations-grid"></div>
    </section>

    <!-- PLAN PAGE -->
    <section id="page-plan" class="page">
      <div class="layout-two-col">
        <div class="panel">
          <h2 style="margin-bottom: 20px; font-size: 18px;"><i data-lucide="plus-circle" style="color:var(--forest);"></i> Add Activity</h2>
          <div class="field">
            <label>Day</label>
            <select id="stop-day">
              <option value="Day 1">Day 1</option>
              <option value="Day 2">Day 2</option>
              <option value="Day 3">Day 3</option>
            </select>
          </div>
          <div class="field">
            <label>Time</label>
            <input type="time" id="stop-time" value="09:00">
          </div>
          <div class="field">
            <label>Location / Activity</label>
            <input type="text" id="stop-name" placeholder="e.g. Visit Louvre Museum">
          </div>
          <button class="btn btn-primary" onclick="addStop()"><i data-lucide="plus"></i> Add Stop</button>
        </div>

        <div class="panel" id="itinerary-display"></div>
      </div>
    </section>

    <!-- BUDGET PAGE -->
    <section id="page-budget" class="page">
      <div class="panel" style="max-width: 550px; margin: 0 auto;">
        <h2 style="margin-bottom: 20px;">Expense Calculator</h2>
        <div class="field">
          <label>Total Allocated Budget ($)</label>
          <input type="number" id="total-budget" value="1000" oninput="recalcBudget()">
        </div>
        <div id="budget-fields"></div>
        <div style="margin-top: 24px; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 12px;">
          <div style="display: flex; justify-content: space-between; font-weight: 700;">
            <span>Estimated Total:</span>
            <span id="spend-total" style="color: var(--cyan);">$0</span>
          </div>
          <div style="height: 8px; background: var(--line); border-radius: 4px; margin-top: 12px; overflow: hidden;">
            <div id="budget-progress" style="height: 100%; width: 0%; background: var(--forest); transition: width 0.3s ease;"></div>
          </div>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- API KEY MODAL -->
<div class="modal" id="api-modal">
  <div class="modal-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h3 style="display: flex; align-items: center; gap: 8px;"><i data-lucide="key" style="color: var(--brass);"></i> API Configuration</h3>
      <i data-lucide="x" style="cursor: pointer;" onclick="closeApiModal()"></i>
    </div>
    <p style="font-size: 13px; color: var(--text-soft); margin-bottom: 16px; line-height: 1.5;">
      You can enter your API keys dynamically below, or paste them directly into the code comments.
    </p>
    <div class="field">
      <label>OpenAI API Key</label>
      <input type="password" id="openai-key-field" placeholder="sk-proj-...">
    </div>
    <div class="field">
      <label>Unsplash Access Key</label>
      <input type="text" id="unsplash-key-field" placeholder="Paste Unsplash Client-ID...">
    </div>
    <button class="btn btn-primary" onclick="saveKey()">Save Keys</button>
  </div>
</div>

<script>
  /* =========================================================================
     API KEYS CONFIGURATION
     =========================================================================
     Option 1: Paste your secret keys directly inside the quotes below.
     Option 2: Leave them blank and enter them via the UI popup button in top right.
     ========================================================================= */

  // 🔑 PASTE YOUR OPENAI API KEY HERE:
  let OPENAI_API_KEY = localStorage.getItem('waypoint_openai_key') || 'YOUR_OPENAI_API_KEY_HERE';

  // 🔑 PASTE YOUR UNSPLASH API KEY HERE (OPTIONAL):
  let unsplashKey = localStorage.getItem('waypoint_unsplash_key') || 'YOUR_UNSPLASH_API_KEY_HERE';

  /* ========================================================================= */

  let places = [
    { name: "Tokyo, Japan", type: "City", desc: "Futuristic skyscrapers, historic shrines, and world-renowned food." },
    { name: "Rome, Italy", type: "Culture", desc: "Ancient ruins, Colosseum, vibrant street life, and gelato." },
    { name: "Maui, Hawaii", type: "Beach", desc: "Volcanic beaches, whale watching, and scenic coastal drives." },
    { name: "Swiss Alps, Switzerland", type: "Nature", desc: "Breathtaking mountain peaks, skiing, and scenic railways." }
  ];

  let itinerary = { "Day 1": [], "Day 2": [], "Day 3": [] };
  let budgetCategories = { Transport: 250, Lodging: 400, Food: 150, Activities: 100 };

  // Canvas particle background setup
  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d');
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let particles = Array.from({length: 30}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2 + 1,
    dx: (Math.random() - 0.5) * 0.4,
    dy: (Math.random() - 0.5) * 0.4
  }));

  function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(6, 182, 212, 0.25)";
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      p.x += p.dx; p.y += p.dy;
      if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
    });
    requestAnimationFrame(drawParticles);
  }
  drawParticles();

  function showPage(pageId) {
    const pages = document.querySelectorAll('.page');
    pages.forEach(p => {
      p.classList.remove('active');
      p.style.opacity = 0;
    });

    const target = document.getElementById(`page-${pageId}`);
    target.classList.add('active');
    
    gsap.fromTo(target, { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.35 });

    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(`nav-${pageId}`).classList.add('active');
  }

  /* =========================================================================
     API FETCHING ENGINE (OpenAI + Wikipedia + Unsplash)
     ========================================================================= */
  async function fetchPlaceData(placeName) {
    let img = 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=600&q=80';
    let text = "An amazing destination ready to be explored.";

    // 1. OpenAI GPT Request for custom travel description
    if (OPENAI_API_KEY && OPENAI_API_KEY !== 'YOUR_OPENAI_API_KEY_HERE') {
      try {
        const aiResponse = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${OPENAI_API_KEY}`
          },
          body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: [{
              role: "user", 
              content: `Provide a captivating, 2-sentence travel description for ${placeName}.`
            }],
            max_tokens: 60
          })
        });
        const aiData = await aiResponse.json();
        if (aiData.choices?.[0]?.message?.content) {
          text = aiData.choices[0].message.content.trim();
        }
      } catch(e) {
        console.warn("OpenAI API call failed, falling back to Wikipedia/Default", e);
      }
    }

    // 2. Unsplash API Request for photos
    if (unsplashKey && unsplashKey !== 'YOUR_UNSPLASH_API_KEY_HERE') {
      try {
        const res = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(placeName)}&client_id=${unsplashKey}&per_page=1`);
        const data = await res.json();
        if (data.results?.[0]) img = data.results[0].urls.regular;
      } catch(e) {}
    }

    // 3. Wikipedia API fallback if OpenAI key is not provided
    if (text === "An amazing destination ready to be explored.") {
      try {
        const wikiRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(placeName)}`);
        const wikiData = await wikiRes.json();
        if (wikiData.extract) text = wikiData.extract;
        if ((!unsplashKey || unsplashKey === 'YOUR_UNSPLASH_API_KEY_HERE') && wikiData.thumbnail) {
          img = wikiData.thumbnail.source;
        }
      } catch(e) {}
    }

    return { img, text };
  }

  async function renderCards() {
    const grid = document.getElementById('destinations-grid');
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px;">Fetching Place Details...</div>';

    let cards = '';
    for (const item of places) {
      const data = await fetchPlaceData(item.name);
      cards += `
        <div class="card" onmousemove="tilt(event, this)" onmouseleave="untilt(this)">
          <img class="card-img" src="${data.img}" alt="${item.name}">
          <div class="card-body">
            <h3>${item.name}</h3>
            <p>${data.text || item.desc}</p>
            <button class="btn btn-primary" onclick="quickAdd('${item.name}')">
              <i data-lucide="plus"></i> Add To Itinerary
            </button>
          </div>
        </div>
      `;
    }
    grid.innerHTML = cards;
    lucide.createIcons();

    gsap.from('.card', { opacity: 0, y: 30, duration: 0.5, stagger: 0.1 });
  }

  function tilt(e, el) {
    const r = el.getBoundingClientRect();
    const x = e.clientX - r.left - r.width/2;
    const y = e.clientY - r.top - r.height/2;
    el.style.transform = `perspective(1000px) rotateX(${-y/25}deg) rotateY(${x/25}deg) translateY(-4px)`;
  }
  function untilt(el) {
    el.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)`;
  }

  async function doSearch() {
    const val = document.getElementById('search-input').value.trim();
    if (!val) return;
    places.unshift({ name: val, type: "Search", desc: "Generating overview..." });
    await renderCards();
    confetti({ particleCount: 40, spread: 50, origin: { y: 0.8 } });
  }

  function addStop() {
    const day = document.getElementById('stop-day').value;
    const time = document.getElementById('stop-time').value;
    const name = document.getElementById('stop-name').value.trim();

    if (!name) return;
    itinerary[day].push({ time, name });
    document.getElementById('stop-name').value = '';
    renderItinerary();
    confetti({ particleCount: 30, spread: 40, origin: { y: 0.8 } });
  }

  function quickAdd(placeName) {
    itinerary["Day 1"].push({ time: "10:00", name: `Visit ${placeName}` });
    showPage('plan');
    renderItinerary();
  }

  function renderItinerary() {
    const container = document.getElementById('itinerary-display');
    let html = '<h2 style="margin-bottom:20px;">Itinerary Schedule</h2>';

    for (const [day, stops] of Object.entries(itinerary)) {
      html += `<h3 style="color:var(--cyan); margin: 16px 0 8px 0;">${day}</h3>`;
      if (stops.length === 0) {
        html += `<p style="font-size:12px; color:var(--text-soft);">No activities planned.</p>`;
      } else {
        stops.forEach((s, idx) => {
          html += `
            <div class="stop-item">
              <div>
                <strong style="color:var(--brass); margin-right:8px;">${s.time}</strong>
                <span>${s.name}</span>
              </div>
              <i data-lucide="trash-2" style="cursor:pointer; color:var(--rust); width:16px;" onclick="removeStop('${day}', ${idx})"></i>
            </div>
          `;
        });
      }
    }
    container.innerHTML = html;
    lucide.createIcons();
  }

  function removeStop(day, idx) {
    itinerary[day].splice(idx, 1);
    renderItinerary();
  }

  function initBudget() {
    const container = document.getElementById('budget-fields');
    let html = '';
    for (const [cat, val] of Object.entries(budgetCategories)) {
      html += `
        <div class="field">
          <label>${cat} ($)</label>
          <input type="number" class="b-input" value="${val}" oninput="recalcBudget()">
        </div>
      `;
    }
    container.innerHTML = html;
    recalcBudget();
  }

  function recalcBudget() {
    let total = 0;
    document.querySelectorAll('.b-input').forEach(i => total += parseFloat(i.value) || 0);
    const limit = parseFloat(document.getElementById('total-budget').value) || 1;

    document.getElementById('spend-total').textContent = `$${total}`;
    const pct = Math.min((total / limit) * 100, 100);
    const bar = document.getElementById('budget-progress');
    bar.style.width = `${pct}%`;
    bar.style.background = total > limit ? 'var(--rust)' : 'var(--forest)';
  }

  function openApiModal() { document.getElementById('api-modal').classList.add('active'); }
  function closeApiModal() { document.getElementById('api-modal').classList.remove('active'); }
  
  function saveKey() {
    const openAiVal = document.getElementById('openai-key-field').value.trim();
    const unsplashVal = document.getElementById('unsplash-key-field').value.trim();
    
    if (openAiVal) {
      OPENAI_API_KEY = openAiVal;
      localStorage.setItem('waypoint_openai_key', openAiVal);
    }
    if (unsplashVal) {
      unsplashKey = unsplashVal;
      localStorage.setItem('waypoint_unsplash_key', unsplashVal);
    }

    document.getElementById('api-status').textContent = "Keys Active";
    closeApiModal();
    renderCards();
  }

  window.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    if (OPENAI_API_KEY && OPENAI_API_KEY !== 'YOUR_OPENAI_API_KEY_HERE') {
      document.getElementById('openai-key-field').value = OPENAI_API_KEY;
      document.getElementById('api-status').textContent = "Keys Active";
    }
    if (unsplashKey && unsplashKey !== 'YOUR_UNSPLASH_API_KEY_HERE') {
      document.getElementById('unsplash-key-field').value = unsplashKey;
    }
    renderCards();
    renderItinerary();
