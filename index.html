<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint — Travel Engine</title>

<style>
  :root {
    /* Bold Green, Blue, and Red Core Palette */
    --bg-dark: #050811;
    --card-bg: #0c1324;
    --border-soft: rgba(255, 255, 255, 0.15);
    
    /* Vibrant Accent Colors */
    --vivid-green: #10b981;
    --green-glow: rgba(16, 185, 129, 0.5);
    
    --electric-blue: #0284c7;
    --blue-glow: rgba(2, 132, 199, 0.5);
    
    --vivid-red: #ef4444;
    --red-glow: rgba(239, 68, 68, 0.5);
    
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --line: #1e293b;
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--card-bg);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 16px;
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--vivid-green), var(--electric-blue));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px var(--green-glow);
  }

  .brand h1 {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
  }

  nav {
    display: flex;
    gap: 6px;
    background: #050811;
    padding: 4px;
    border-radius: 12px;
    border: 1px solid var(--border-soft);
  }

  nav button {
    background: transparent;
    color: var(--text-muted);
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
  }

  nav button.active {
    color: #fff;
    background: var(--electric-blue);
    box-shadow: 0 0 15px var(--blue-glow);
  }

  main {
    flex: 1;
    margin-top: 28px;
  }

  .page {
    display: none;
    animation: fadeIn 0.3s forwards ease-out;
  }

  .page.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .search-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    background: var(--card-bg);
    padding: 8px 8px 8px 18px;
    border-radius: 14px;
    border: 1px solid var(--border-soft);
  }

  .search-bar input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-main);
    font-size: 16px;
    outline: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--card-bg);
    border: 2px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 24px;
    position: relative;
    transition: all 0.2s ease;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card:hover {
    border-color: var(--electric-blue);
    transform: translateY(-3px);
  }

  .card.selected {
    border-color: var(--vivid-green);
    background: rgba(16, 185, 129, 0.12);
    box-shadow: 0 0 25px var(--green-glow);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .card-header h3 {
    font-size: 20px;
    color: #fff;
    font-weight: 700;
  }

  .card-body p {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .selection-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
  }

  .card.selected .selection-indicator {
    color: var(--vivid-green);
  }

  .selection-dock {
    position: sticky;
    bottom: 20px;
    margin-top: 24px;
    background: #0c1324;
    border: 2px solid var(--vivid-green);
    box-shadow: 0 10px 30px var(--green-glow);
    border-radius: var(--radius);
    padding: 16px 24px;
    display: none;
    justify-content: space-between;
    align-items: center;
    z-index: 90;
  }

  .selection-dock.active {
    display: flex;
  }

  .btn {
    padding: 12px 22px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s ease;
  }

  .btn-green {
    background: var(--vivid-green);
    color: #fff;
    box-shadow: 0 4px 14px var(--green-glow);
  }

  .btn-green:hover {
    background: #059669;
    transform: translateY(-2px);
  }

  .btn-blue {
    background: var(--electric-blue);
    color: #fff;
    box-shadow: 0 4px 14px var(--blue-glow);
  }

  .btn-blue:hover {
    background: #0369a1;
    transform: translateY(-2px);
  }

  .btn-red {
    background: var(--vivid-red);
    color: #fff;
    box-shadow: 0 4px 14px var(--red-glow);
  }

  .btn-red:hover {
    background: #dc2626;
    transform: translateY(-2px);
  }

  .layout-two-col {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
  }

  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 24px;
  }

  .place-summary-card {
    background: rgba(2, 132, 199, 0.15);
    border: 2px solid var(--electric-blue);
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 24px;
  }

  .place-summary-card h2 {
    color: var(--electric-blue);
    font-size: 20px;
    margin-bottom: 6px;
  }

  .place-summary-card p {
    font-size: 14px;
    color: var(--text-main);
    line-height: 1.5;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .field input, .field select {
    width: 100%;
    background: #050811;
    border: 1px solid var(--line);
    color: var(--text-main);
    padding: 12px;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
  }

  .stop-item {
    background: #050811;
    border: 1px solid var(--border-soft);
    border-left: 4px solid var(--electric-blue);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-footer-action {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    justify-content: flex-end;
  }

  @media(max-width: 768px) {
    .layout-two-col { grid-template-columns: 1fr; }
    header { flex-direction: column; gap: 16px; }
  }
</style>
</head>
<body>

<div class="app">
  
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      </div>
      <div>
        <h1>Waypoint</h1>
        <p style="font-size: 11px; color: var(--text-muted);">Offline Travel Engine</p>
      </div>
    </div>

    <nav>
      <button id="nav-home" class="active" onclick="showPage('home')">Explore</button>
      <button id="nav-plan" onclick="showPage('plan')">Plan</button>
      <button id="nav-budget" onclick="showPage('budget')">Budget</button>
    </nav>
  </header>

  <main>

    <!-- EXPLORE PAGE -->
    <section id="page-home" class="page active">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search or add any location..." onkeypress="if(event.key==='Enter') doSearch()">
        <button class="btn btn-blue" style="width:auto; padding: 0 24px;" onclick="doSearch()">Search</button>
      </div>

      <div class="grid" id="destinations-grid"></div>

      <div class="selection-dock" id="dock">
        <div>
          <span style="font-size: 12px; color: var(--text-muted); display: block;">Selected Destination:</span>
          <strong id="dock-title" style="font-size: 18px; color: #fff;">None</strong>
        </div>
        <button class="btn btn-green" onclick="proceedToPlan()">Proceed to Plan &rarr;</button>
      </div>
    </section>

    <!-- PLAN PAGE -->
    <section id="page-plan" class="page">
      <div class="place-summary-card" id="place-summary-banner">
        <h2>📍 <span id="banner-title">No Destination Selected</span></h2>
        <p id="banner-desc">Select a location from the Explore screen to view details and construct your schedule.</p>
      </div>

      <div class="layout-two-col">
        <div class="panel">
          <h2 style="margin-bottom: 20px; font-size: 18px; color: var(--vivid-green);">+ Add Activity</h2>
          <div class="field">
            <label>Day</label>
            <select id="stop-day">
              <option value="Day 1">Day 1</option>
              <option value="Day 2">Day 2</option>
              <option value="Day 3">Day 3</option>
            </select>
          </div>
          <div class="field">
            <label>Time</label>
            <input type="time" id="stop-time" value="09:00">
          </div>
          <div class="field">
            <label>Location / Activity</label>
            <input type="text" id="stop-name" placeholder="e.g. Visit Museum">
          </div>
          <button class="btn btn-green" style="width:100%;" onclick="addStop()">+ Add Stop</button>
        </div>

        <div class="panel">
          <div id="itinerary-display"></div>
          
          <div class="nav-footer-action">
            <button class="btn btn-blue" onclick="showPage('budget')">Continue to Budget &rarr;</button>
          </div>
        </div>
      </div>
    </section>

    <!-- BUDGET PAGE -->
    <section id="page-budget" class="page">
      <div class="panel" style="max-width: 550px; margin: 0 auto;">
        <h2 style="margin-bottom: 20px; color: var(--electric-blue);">💳 Expense Calculator</h2>
        <div class="field">
          <label>Total Allocated Budget ($)</label>
          <input type="number" id="total-budget" value="1000" oninput="recalcBudget()">
        </div>
        <div id="budget-fields"></div>
        <div style="margin-top: 24px; padding: 20px; background: rgba(0,0,0,0.5); border-radius: 12px; border: 1px solid var(--line);">
          <div style="display: flex; justify-content: space-between; font-weight: 700;">
            <span>Estimated Total:</span>
            <span id="spend-total" style="color: var(--vivid-green);">$0</span>
          </div>
          <div style="height: 10px; background: var(--line); border-radius: 5px; margin-top: 12px; overflow: hidden;">
            <div id="budget-progress" style="height: 100%; width: 0%; background: var(--vivid-green); transition: width 0.3s ease;"></div>
          </div>
        </div>

        <div class="nav-footer-action" style="justify-content: center; margin-top: 24px;">
          <button class="btn btn-red" style="width: 100%;" onclick="showPage('home')">Back to Explore</button>
        </div>
      </div>
    </section>

  </main>
</div>

<script>
  let places = [
    { id: 1, name: "Tokyo, Japan", desc: "A sprawling metropolis blending futuristic tech with traditional shrines, world-class street food, and vibrant district culture." },
    { id: 2, name: "Rome, Italy", desc: "An open-air museum filled with ancient ruins, iconic architecture, rich history, and authentic culinary traditions." },
    { id: 3, name: "Maui, Hawaii", desc: "A tropical destination featuring volcanic coastlines, crystal waters, scenic mountain highways, and lush valleys." },
    { id: 4, name: "Swiss Alps, Switzerland", desc: "Dramatic alpine mountain ranges offering premier skiing, historic mountain railways, and panoramic hiking routes." }
  ];

  let selectedPlace = null;
  let itinerary = { "Day 1": [], "Day 2": [], "Day 3": [] };
  let budgetCategories = { Transport: 250, Lodging: 400, Food: 150, Activities: 100 };

  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page-${pageId}`).classList.add('active');

    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(`nav-${pageId}`).classList.add('active');
  }

  function renderCards() {
    const grid = document.getElementById('destinations-grid');
    let cards = '';

    places.forEach(item => {
      const isSelected = selectedPlace && selectedPlace.id === item.id;
      cards += `
        <div class="card ${isSelected ? 'selected' : ''}" onclick="selectCard(${item.id})">
          <div>
            <div class="card-header">
              <h3>${item.name}</h3>
              <span style="color:${isSelected ? 'var(--vivid-green)' : 'var(--electric-blue)'}">📍</span>
            </div>
            <div class="card-body">
              <p>${item.desc}</p>
            </div>
          </div>
          <div class="selection-indicator">
            <span>${isSelected ? '✓ Selected' : '○ Click to select'}</span>
          </div>
        </div>
      `;
    });

    grid.innerHTML = cards;
  }

  function selectCard(id) {
    selectedPlace = places.find(p => p.id === id);
    renderCards();

    const dock = document.getElementById('dock');
    document.getElementById('dock-title').textContent = selectedPlace.name;
    dock.classList.add('active');

    document.getElementById('banner-title').textContent = selectedPlace.name;
    document.getElementById('banner-desc').textContent = selectedPlace.desc;
  }

  function proceedToPlan() {
    if (!selectedPlace) return;
    if (itinerary["Day 1"].length === 0) {
      itinerary["Day 1"].unshift({ time: "09:00", name: `Arrive in ${selectedPlace.name}` });
    }
    showPage('plan');
    renderItinerary();
  }

  function doSearch() {
    const val = document.getElementById('search-input').value.trim();
    if (!val) return;
    
    const newPlace = {
      id: Date.now(),
      name: val,
      desc: `Explore the culture, historical landmarks, and top local spots in ${val}.`
    };

    places.unshift(newPlace);
    document.getElementById('search-input').value = '';
    selectCard(newPlace.id);
  }

  function addStop() {
    const day = document.getElementById('stop-day').value;
    const time = document.getElementById('stop-time').value;
    const name = document.getElementById('stop-name').value.trim();

    if (!name) return;
    itinerary[day].push({ time, name });
    document.getElementById('stop-name').value = '';
    renderItinerary();
  }

  function renderItinerary() {
    const container = document.getElementById('itinerary-display');
    let html = '<h2 style="margin-bottom:20px; color: var(--electric-blue);">Itinerary Schedule</h2>';

    for (const [day, stops] of Object.entries(itinerary)) {
      html += `<h3 style="color:var(--vivid-green); margin: 16px 0 8px 0;">${day}</h3>`;
      if (stops.length === 0) {
        html += `<p style="font-size:13px; color:var(--text-muted);">No activities planned.</p>`;
      } else {
        stops.forEach((s, idx) => {
          html += `
            <div class="stop-item">
              <div>
                <strong style="color:var(--electric-blue); margin-right:8px;">${s.time}</strong>
                <span>${s.name}</span>
              </div>
              <button style="background:none; border:none; color:var(--vivid-red); cursor:pointer; font-weight:bold;" onclick="removeStop('${day}', ${idx})">✕</button>
            </div>
          `;
        });
      }
    }
    container.innerHTML = html;
  }

  function removeStop(day, idx) {
    itinerary[day].splice(idx, 1);
    renderItinerary();
  }

  function initBudget() {
    const container = document.getElementById('budget-fields');
    let html = '';
    for (const [cat, val] of Object.entries(budgetCategories)) {
      html += `
        <div class="field">
          <label>${cat} ($)</label>
          <input type="number" class="b-input" value="${val}" oninput="recalcBudget()">
        </div>
      `;
    }
    container.innerHTML = html;
    recalcBudget();
  }

  function recalcBudget() {
    let total = 0;
    document.querySelectorAll('.b-input').forEach(i => total += parseFloat(i.value) || 0);
    const limit = parseFloat(document.getElementById('total-budget').value) || 1;

    document.getElementById('spend-total').textContent = `$${total}`;
    const pct = Math.min((total / limit) * 100, 100);
    const bar = document.getElementById('budget-progress');
    bar.style.width = `${pct}%`;
    bar.style.background = total > limit ? 'var(--vivid-red)' : 'var(--vivid-green)';
  }

  window.addEventListener('DOMContentLoaded', () => {
    renderCards();
    renderItinerary();
    initBudget();
  });
</script>
</body>
</html>
