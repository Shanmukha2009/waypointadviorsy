<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint — Travel Engine</title>

<!-- Front-End CDN Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
  :root {
    /* Strict Green, Blue, and Red Core Palette */
    --bg-dark: #050811;
    --card-bg: rgba(12, 19, 36, 0.85);
    --border-soft: rgba(255, 255, 255, 0.12);
    
    /* Main Accent Colors */
    --vivid-green: #10b981;
    --green-glow: rgba(16, 185, 129, 0.4);
    
    --electric-blue: #0284c7;
    --blue-glow: rgba(2, 132, 199, 0.4);
    
    --vivid-red: #ef4444;
    --red-glow: rgba(239, 68, 68, 0.4);
    
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --line: #1e293b;
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font);
    min-height: 100vh;
    overflow-x: hidden;
  }

  #fx-canvas {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: 0;
    pointer-events: none;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 16px;
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--vivid-green), var(--electric-blue));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px var(--green-glow);
  }

  .brand h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #fff;
  }

  nav {
    display: flex;
    gap: 6px;
    background: rgba(5, 8, 17, 0.8);
    padding: 4px;
    border-radius: 12px;
    border: 1px solid var(--border-soft);
  }

  nav button {
    background: transparent;
    color: var(--text-muted);
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
  }

  nav button.active {
    color: #fff;
    background: linear-gradient(135deg, var(--electric-blue), #0369a1);
    box-shadow: 0 0 15px var(--blue-glow);
  }

  main {
    flex: 1;
    margin-top: 28px;
  }

  .page {
    display: none;
    opacity: 0;
  }

  .page.active {
    display: block;
    opacity: 1;
  }

  .search-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    background: var(--card-bg);
    padding: 8px 8px 8px 18px;
    border-radius: 14px;
    border: 1px solid var(--border-soft);
  }

  .search-bar input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-main);
    font-size: 16px;
    outline: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--card-bg);
    border: 2px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 24px;
    position: relative;
    transition: all 0.3s ease;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card:hover {
    border-color: var(--electric-blue);
    transform: translateY(-3px);
  }

  .card.selected {
    border-color: var(--vivid-green);
    background: rgba(16, 185, 129, 0.1);
    box-shadow: 0 0 25px var(--green-glow);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .card-header h3 {
    font-size: 20px;
    color: #fff;
    font-weight: 700;
  }

  .card-body p {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .selection-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
  }

  .card.selected .selection-indicator {
    color: var(--vivid-green);
  }

  .selection-dock {
    position: sticky;
    bottom: 20px;
    margin-top: 24px;
    background: rgba(12, 19, 36, 0.95);
    backdrop-filter: blur(16px);
    border: 2px solid var(--vivid-green);
    box-shadow: 0 10px 30px var(--green-glow);
    border-radius: var(--radius);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transform: translateY(120%);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 90;
  }

  .selection-dock.active {
    transform: translateY(0);
  }

  .btn {
    padding: 12px 22px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s ease;
  }

  .btn-green {
    background: linear-gradient(135deg, var(--vivid-green), #059669);
    color: #fff;
    box-shadow: 0 4px 14px var(--green-glow);
  }

  .btn-green:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--green-glow);
  }

  .btn-blue {
    background: linear-gradient(135deg, var(--electric-blue), #0369a1);
    color: #fff;
    box-shadow: 0 4px 14px var(--blue-glow);
  }

  .btn-blue:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--blue-glow);
  }

  .btn-red {
    background: linear-gradient(135deg, var(--vivid-red), #dc2626);
    color: #fff;
    box-shadow: 0 4px 14px var(--red-glow);
  }

  .btn-red:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--red-glow);
  }

  .layout-two-col {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
  }

  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 24px;
  }

  .place-summary-card {
    background: linear-gradient(135deg, rgba(2, 132, 199, 0.2), rgba(16, 185, 129, 0.2));
    border: 1px solid var(--electric-blue);
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 24px;
  }

  .place-summary-card h2 {
    color: var(--electric-blue);
    font-size: 20px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .place-summary-card p {
    font-size: 14px;
    color: var(--text-main);
    line-height: 1.5;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .field input, .field select {
    width: 100%;
    background: rgba(5, 8, 17, 0.9);
    border: 1px solid var(--line);
    color: var(--text-main);
    padding: 12px;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
  }

  .stop-item {
    background: rgba(5, 8, 17, 0.8);
    border: 1px solid var(--border-soft);
    border-left: 4px solid var(--electric-blue);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-footer-action {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    justify-content: flex-end;
  }

  @media(max-width: 768px) {
    .layout-two-col { grid-template-columns: 1fr; }
    header { flex-direction: column; gap: 16px; }
  }
</style>
</head>
<body>

<canvas id="fx-canvas"></canvas>

<div class="app">
  
  <header>
    <div class="brand">
      <div class="brand-icon"><i data-lucide="compass" style="color: #fff;"></i></div>
      <div>
        <h1>Waypoint</h1>
        <p style="font-size: 11px; color: var(--text-muted);">Offline Travel Engine</p>
      </div>
    </div>

    <nav>
      <button id="nav-home" class="active" onclick="showPage('home')">
        <i data-lucide="map-pin"></i> Explore
      </button>
      <button id="nav-plan" onclick="showPage('plan')">
        <i data-lucide="calendar"></i> Plan
      </button>
      <button id="nav-budget" onclick="showPage('budget')">
        <i data-lucide="wallet"></i> Budget
      </button>
    </nav>
  </header>

  <main>

    <!-- EXPLORE PAGE -->
    <section id="page-home" class="page active">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search or add any location..." onkeypress="if(event.key==='Enter') doSearch()">
        <button class="btn btn-blue" style="width:auto; padding: 0 24px;" onclick="doSearch()">Search</button>
      </div>

      <div class="grid" id="destinations-grid"></div>

      <div class="selection-dock" id="dock">
        <div>
          <span style="font-size: 12px; color: var(--text-muted); display: block;">Selected Destination:</span>
          <strong id="dock-title" style="font-size: 18px; color: #fff;">None</strong>
        </div>
        <button class="btn btn-green" onclick="proceedToPlan()">
          Proceed to Plan <i data-lucide="arrow-right"></i>
        </button>
      </div>
    </section>

    <!-- PLAN PAGE -->
    <section id="page-plan" class="page">
      <div class="place-summary-card" id="place-summary-banner">
        <h2><i data-lucide="map-pin"></i> <span id="banner-title">No Destination Selected</span></h2>
        <p id="banner-desc">Select a location from the Explore screen to view details and construct your schedule.</p>
      </div>

      <div class="layout-two-col">
        <div class="panel">
          <h2 style="margin-bottom: 20px; font-size: 18px; color: var(--vivid-green);"><i data-lucide="plus-circle"></i> Add Activity</h2>
          <div class="field">
            <label>Day</label>
            <select id="stop-day">
              <option value="Day 1">Day 1</option>
              <option value="Day 2">Day 2</option>
              <option value="Day 3">Day 3</option>
            </select>
          </div>
          <div class="field">
            <label>Time</label>
            <input type="time" id="stop-time" value="09:00">
          </div>
          <div class="field">
            <label>Location / Activity</label>
            <input type="text" id="stop-name" placeholder="e.g. Visit Museum">
          </div>
          <button class="btn btn-green" style="width:100%;" onclick="addStop()"><i data-lucide="plus"></i> Add Stop</button>
        </div>

        <div class="panel">
          <div id="itinerary-display"></div>
          
          <div class="nav-footer-action">
            <button class="btn btn-blue" onclick="showPage('budget')">
              Continue to Budget <i data-lucide="arrow-right"></i>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- BUDGET PAGE -->
    <section id="page-budget" class="page">
      <div class="panel" style="max-width: 550px; margin: 0 auto;">
        <h2 style="margin-bottom: 20px; color: var(--electric-blue);"><i data-lucide="wallet"></i> Expense Calculator</h2>
        <div class="field">
          <label>Total Allocated Budget ($)</label>
          <input type="number" id="total-budget" value="1000" oninput="recalcBudget()">
        </div>
        <div id="budget-fields"></div>
        <div style="margin-top: 24px; padding: 20px; background: rgba(0,0,0,0.5); border-radius: 12px; border: 1px solid var(--line);">
          <div style="display: flex; justify-content: space-between; font-weight: 700;">
            <span>Estimated Total:</span>
            <span id="spend-total" style="color: var(--vivid-green);">$0</span>
          </div>
          <div style="height: 10px; background: var(--line); border-radius: 5px; margin-top: 12px; overflow: hidden;">
            <div id="budget-progress" style="height: 100%; width: 0%; background: var(--vivid-green); transition: width 0.3s ease;"></div>
          </div>
        </div>

        <div class="nav-footer-action" style="justify-content: center; margin-top: 24px;">
          <button class="btn btn-red" style="width: 100%;" onclick="showPage('home')">
            <i data-lucide="rotate-ccw"></i> Back to Explore
          </button>
        </div>
      </div>
    </section>

  </main>
</div>

<script>
  let places = [
    { id: 1, name: "Tokyo, Japan", desc: "A sprawling metropolis blending futuristic tech with traditional shrines, world-class street food, and vibrant district culture." },
    { id: 2, name: "Rome, Italy", desc: "An open-air museum filled with ancient ruins, iconic architecture, rich history, and authentic culinary traditions." },
    { id: 3, name: "Maui, Hawaii", desc: "A tropical destination featuring volcanic coastlines, crystal waters, scenic mountain highways, and lush valleys." },
    { id: 4, name: "Swiss Alps, Switzerland", desc: "Dramatic alpine mountain ranges offering premier skiing, historic mountain railways, and panoramic hiking routes." }
  ];

  let selectedPlace = null;
  let itinerary = { "Day 1": [], "Day 2": [], "Day 3": [] };
  let budgetCategories = { Transport: 250, Lodging: 400, Food: 150, Activities: 100 };

  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d');
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const particleColors = ['rgba(16, 185, 129, 0.35)', 'rgba(2, 132, 199, 0.35)', 'rgba(239, 68, 68, 0.35)'];
  let particles = Array.from({length: 35}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2.5 + 1,
    color: particleColors[Math.floor(Math.random() * particleColors.length)],
    dx: (Math.random() - 0.5) * 0.4,
    dy: (Math.random() - 0.5) * 0.4
  }));

  function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      p.x += p.dx; p.y += p.dy;
      if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
    });
    requestAnimationFrame(drawParticles);
  }
  drawParticles();

  function showPage(pageId) {
    const pages = document.querySelectorAll('.page');
    pages.forEach(p => {
      p.classList.remove('active');
      p.style.opacity = 0;
    });

    const target = document.getElementById(`page-${pageId}`);
    target.classList.add('active');
    
    gsap.fromTo(target, { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.35 });

    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(`nav-${pageId}`).classList.add('active');
  }

  function renderCards() {
    const grid = document.getElementById('destinations-grid');
    let cards = '';

    places.forEach(item => {
      const isSelected = selectedPlace && selectedPlace.id === item.id;
      cards += `
        <div class="card ${isSelected ? 'selected' : ''}" onclick="selectCard(${item.id})">
          <div>
            <div class="card-header">
              <h3>${item.name}</h3>
              <i data-lucide="map-pin" style="color:${isSelected ? 'var(--vivid-green)' : 'var(--electric-blue)'}"></i>
            </div>
            <div class="card-body">
              <p>${item.desc}</p>
            </div>
          </div>
          <div class="selection-indicator">
            <i data-lucide="${isSelected ? 'check-circle-2' : 'circle'}"></i>
            <span>${isSelected ? 'Selected' : 'Click to select'}</span>
          </div>
        </div>
      `;
    });

    grid.innerHTML = cards;
    lucide.createIcons();
  }

  function selectCard(id) {
    selectedPlace = places.find(p => p.id === id);
    renderCards();

    const dock = document.getElementById('dock');
    document.getElementById('dock-title').textContent = selectedPlace.name;
    dock.classList.add('active');

    document.getElementById('banner-title').textContent = selectedPlace.name;
    document.getElementById('banner-desc').textContent = selectedPlace.desc;
  }

  function proceedToPlan() {
    if (!selectedPlace) return;
    
    if (itinerary["Day 1"].length === 0) {
      itinerary["Day 1"].unshift({ time: "09:00", name: `Arrive in ${selectedPlace.name}` });
    }
    
    showPage('plan');
    renderItinerary();
    confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
  }

  function doSearch() {
    const val = document.getElementById('search-input').value.trim();
    if (!val) return;
    
    const newPlace = {
      id: Date.now(),
      name: val,
      desc: `Explore the culture, historical landmarks, and top local spots in ${val}.`
    };

    places.unshift(newPlace);
    document.getElementById('search-input').value = '';
    selectCard(newPlace.id);
  }

  function addStop() {
    const day = document.getElementById('stop-day').value;
    const time = document.getElementById('stop-time').value;
    const name = document.getElementById('stop-name').value.trim();

    if (!name) return;
    itinerary[day].push({ time, name });
    document.getElementById('stop-name').value = '';
    renderItinerary();
    confetti({ particleCount: 30, spread: 40, origin: { y: 0.8 } });
  }

  function renderItinerary() {
    const container = document.getElementById('itinerary-display');
    let html = '<h2 style="margin-bottom:20px; color: var(--electric-blue);">Itinerary Schedule</h2>';

    for (const [day, stops] of Object.entries(itinerary)) {
      html += `<h3 style="color:var(--vivid-green); margin: 16px 0 8px 0;">${day}</h3>`;
      if (stops.length === 0) {
        html += `<p style="font-size:13px; color:var(--text-muted);">No activities planned.</p>`;
      } else {
        stops.forEach((s, idx) => {
          html += `
            <div class="stop-item">
              <div>
                <strong style="color:var(--electric-blue); margin-right:8px;">${s.time}</strong>
                <span>${s.name}</span>
              </div>
              <i data-lucide="trash-2" style="cursor:pointer; color:var(--vivid-red); width:18px;" onclick="removeStop('${day}', ${idx})"></i>
            </div>
          `;
        });
      }
    }
    container.innerHTML = html;
    lucide.createIcons();
  }

  function removeStop(day, idx) {
    itinerary[day].splice(idx, 1);
    renderItinerary();
  }

  function initBudget() {
    const container = document.getElementById('budget-fields');
    let html = '';
    for (const [cat, val] of Object.entries(budgetCategories)) {
      html += `
        <div class="field">
          <label>${cat} ($)</label>
          <input type="number" class="b-input" value="${val}" oninput="recalcBudget()">
        </div>
      `;
    }
    container.innerHTML = html;
    recalcBudget();
  }

  function recalcBudget() {
    let total = 0;
    document.querySelectorAll('.b-input').forEach(i => total += parseFloat(i.value) || 0);
    const limit = parseFloat(document.getElementById('total-budget').value) || 1;

    document.getElementById('spend-total').textContent = `$${total}`;
    const pct = Math.min((total / limit) * 100, 100);
    const bar = document.getElementById('budget-progress');
    bar.style.width = `${pct}%`;
    bar.style.background = total > limit ? 'var(--vivid-red)' : 'var(--vivid-green)';
  }

  window.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    renderCards();
    renderItinerary();
    initBudget();
  });
</script>
</body>
</html>
