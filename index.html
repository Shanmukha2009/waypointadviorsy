<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAY POINT ADVISOR — Modern Travel Planner</title>

<!-- Print & PDF Export Styles -->
<style media="print">
  body { background: #fff !important; color: #000 !important; font-family: sans-serif; padding: 20px; }
  .no-print, nav, button, select, input, .add-form-grid { display: none !important; }
  .print-only { display: block !important; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { border: 1px solid #000; padding: 10px; text-align: left; }
  th { background-color: #f2f2f2; }
  h1, p { margin-bottom: 10px; }
</style>

<!-- App Styles -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

  :root {
    --bg: #030712;
    --panel: rgba(17, 24, 39, 0.75);
    --panel-border: rgba(255, 255, 255, 0.12);
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.35);
    --secondary-accent: #a855f7;
    --secondary-glow: rgba(168, 85, 247, 0.35);
    --text: #f8fafc;
    --text-sub: #94a3b8;
    --radius: 16px;
    --font: 'Plus Jakarta Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    background-image: 
      radial-gradient(at 15% 15%, rgba(56, 189, 248, 0.15) 0px, transparent 40%),
      radial-gradient(at 85% 85%, rgba(168, 85, 247, 0.15) 0px, transparent 40%);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font);
    line-height: 1.5;
    padding-bottom: 60px;
  }

  .container {
    max-width: 1050px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Header & Navigation Tabs */
  header {
    border-bottom: 1px solid var(--panel-border);
    padding: 24px 0;
    margin-bottom: 30px;
    backdrop-filter: blur(12px);
  }

  .nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }

  .logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .logo:hover {
    transform: scale(1.02);
  }

  .logo span {
    background: linear-gradient(135deg, var(--accent), var(--secondary-accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  nav {
    display: flex;
    gap: 6px;
    background: rgba(15, 23, 42, 0.8);
    padding: 6px;
    border-radius: var(--radius);
    border: 1px solid var(--panel-border);
  }

  nav button {
    background: transparent;
    color: var(--text-sub);
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  nav button:hover { color: #fff; }

  nav button.active {
    background: linear-gradient(135deg, var(--accent), var(--secondary-accent));
    color: #000;
    box-shadow: 0 4px 20px var(--accent-glow);
  }

  /* Page Layouts */
  .page { display: none; }
  .page.active { display: block; }

  /* Glassmorphism Panels */
  .panel {
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
  }

  .panel-title {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }

  .form-group label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-sub);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  select, input[type="number"], input[type="text"], input[type="date"], input[type="email"] {
    background: rgba(3, 7, 18, 0.85);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 14px 18px;
    border-radius: 12px;
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    width: 100%;
    transition: all 0.2s ease;
  }

  select:focus, input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  /* Filter Controls */
  .filter-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--panel-border);
    color: var(--text-sub);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .filter-btn.active, .filter-btn:hover {
    border-color: var(--accent);
    color: #fff;
    background: var(--accent-glow);
  }

  /* Cards Grid */
  .grid-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 20px;
  }

  .card {
    background: rgba(15, 23, 42, 0.65);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 22px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .card:hover {
    border-color: var(--accent);
    transform: translateY(-5px);
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5), 0 0 25px var(--accent-glow);
  }

  .card.selected {
    border-color: var(--accent);
    background: rgba(56, 189, 248, 0.12);
    box-shadow: 0 0 20px var(--accent-glow);
  }

  .card h3 {
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 8px;
  }

  .card p {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 18px;
    line-height: 1.4;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
  }

  .badge-category {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--secondary-accent);
    letter-spacing: 0.5px;
  }

  .badge-cost {
    display: inline-block;
    background: var(--accent-glow);
    color: var(--accent);
    font-weight: 800;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid rgba(56, 189, 248, 0.4);
  }

  /* Item Rows */
  .item-row {
    background: rgba(3, 7, 18, 0.8);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }

  .item-row:hover {
    border-color: rgba(255, 255, 255, 0.25);
  }

  .item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
  }

  .item-desc {
    font-size: 13px;
    color: var(--text-sub);
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .slider-row label {
    font-size: 12px;
    color: var(--text-sub);
    font-weight: 600;
  }

  .slider-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .val-badge {
    font-size: 15px;
    font-weight: 800;
    color: var(--accent);
  }

  /* Buttons */
  .btn {
    background: linear-gradient(135deg, var(--accent), var(--secondary-accent));
    color: #000;
    border: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    display: inline-block;
    transition: all 0.25s ease;
    box-shadow: 0 4px 20px var(--accent-glow);
  }

  .btn-secondary {
    background: rgba(30, 41, 59, 0.9);
    color: var(--text);
    border: 1px solid var(--panel-border);
    box-shadow: none;
  }

  .btn:hover {
    opacity: 0.95;
    transform: translateY(-2px);
  }

  .btn-danger {
    background: #ef4444;
    color: #fff;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }

  .add-form-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr auto;
    gap: 12px;
    align-items: flex-end;
  }

  .budget-summary {
    display: flex;
    justify-content: space-between;
    padding: 18px 24px;
    background: rgba(3, 7, 18, 0.9);
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    margin-bottom: 20px;
    font-size: 16px;
  }

  .summary-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }

  .summary-table th, .summary-table td {
    padding: 14px;
    text-align: left;
    border-bottom: 1px solid var(--panel-border);
    font-size: 14px;
  }

  .summary-table th {
    color: var(--text-sub);
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.8px;
  }

  .action-bar {
    display: flex;
    gap: 14px;
    justify-content: flex-end;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .print-only { display: none; }
</style>
</head>
<body>

<!-- Printable Structure -->
<div class="print-only">
  <h1 id="p-title">WAY POINT ADVISOR Briefing</h1>
  <p id="p-date"></p>
  <div id="p-content" style="margin-top: 20px;"></div>
</div>

<div class="container no-print">

  <!-- Header & Nav Tabs -->
  <header>
    <div class="nav-bar">
      <!-- Click Logo to Return Home -->
      <div class="logo" onclick="showPage('step1')">
        <span>📍 WayPoint</span> Advisor
      </div>
      <nav>
        <button id="nav-step1" class="active" onclick="showPage('step1')">🏠 Home</button>
        <button id="nav-step2" onclick="showPage('step2')">2. Spots</button>
        <button id="nav-step3" onclick="showPage('step3')">3. Planning</button>
        <button id="nav-step4" onclick="showPage('step4')">4. Summary</button>
      </nav>
    </div>
  </header>

  <!-- SCREEN 1: HOME / PREFERENCES -->
  <div id="page-step1" class="page active">
    <div class="panel">
      <div class="panel-title">Step 1: Set Your Trip Preferences</div>
      <div class="form-group">
        <label>Total Budget Goal ($USD):</label>
        <input type="number" id="input-budget" value="1000" min="0" step="50">
      </div>
      <div class="form-group">
        <label>Select Destination:</label>
        <select id="location-select" onchange="onCitySelectChange(this.value)">
          <!-- Dynamic options populated by JS -->
        </select>
      </div>
      <div class="form-group">
        <label>Trip Date:</label>
        <input type="date" id="trip-date" value="2026-10-15">
      </div>
      <div style="text-align: right; margin-top: 28px;">
        <button class="btn" onclick="goToStep2()">Explore Attractions →</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: RECOMMENDATIONS & NEARBY SPOTS -->
  <div id="page-step2" class="page">
    <div class="panel">
      <div class="panel-title">
        <span>Attractions in <span id="nearby-city-title" style="color: var(--accent);">City</span></span>
        <span id="spot-count-badge" style="font-size: 13px; color: var(--text-sub);">Locations Available</span>
      </div>
      
      <!-- Filter Bar -->
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterCategory('All', this)">All Spots</button>
        <button class="filter-btn" onclick="filterCategory('Sight', this)">Sights</button>
        <button class="filter-btn" onclick="filterCategory('Activity', this)">Activities</button>
        <button class="filter-btn" onclick="filterCategory('Dining', this)">Dining</button>
        <button class="filter-btn" onclick="filterCategory('Nightlife', this)">Nightlife</button>
        <button class="filter-btn" onclick="filterCategory('Shopping', this)">Shopping</button>
      </div>

      <div class="grid-cards" id="recommendations-grid"></div>
      
      <div style="text-align: right; margin-top: 28px;">
        <button class="btn" onclick="showPage('step3')">Go to Planning Screen →</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 3: PLANNING & BUDGET ALLOCATOR -->
  <div id="page-step3" class="page">
    <!-- Custom Place Panel -->
    <div class="panel">
      <div class="panel-title">Add Custom Spot</div>
      <div class="add-form-grid">
        <div>
          <label style="font-size: 11px; color: var(--text-sub); display:block; margin-bottom: 6px;">Spot Name</label>
          <input type="text" id="custom-name" placeholder="e.g. Helicopter Skyline Tour">
        </div>
        <div>
          <label style="font-size: 11px; color: var(--text-sub); display:block; margin-bottom: 6px;">Category</label>
          <select id="custom-category">
            <option value="Activity">Activity</option>
            <option value="Sight">Sight</option>
            <option value="Dining">Dining</option>
            <option value="Nightlife">Nightlife</option>
            <option value="Shopping">Shopping</option>
          </select>
        </div>
        <div>
          <label style="font-size: 11px; color: var(--text-sub); display:block; margin-bottom: 6px;">Cost ($)</label>
          <input type="number" id="custom-cost" value="100" min="0">
        </div>
        <div>
          <button class="btn" onclick="addCustomPlace()">+ Add</button>
        </div>
      </div>
    </div>

    <!-- Planner Items -->
    <div class="panel">
      <div class="panel-title">
        <span>Itinerary Budget Adjuster</span>
      </div>

      <div class="budget-summary">
        <div>Total Allocated: <span id="allocated-budget" style="color: var(--accent); font-weight:800;">$0</span></div>
        <div>Target Budget Goal: <span id="target-budget-display" style="font-weight:800;">$0</span></div>
      </div>

      <div id="planner-items-container"></div>

      <div style="text-align: right; margin-top: 28px; display: flex; justify-content: space-between; align-items: center;">
        <button class="btn btn-secondary" onclick="showPage('step2')">← Select More Spots</button>
        <button class="btn" onclick="showPage('step4')">View Final Summary →</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 4: SUMMARY & EXPORT -->
  <div id="page-step4" class="page">
    <div class="panel">
      <div class="panel-title">
        <span>Trip Briefing</span>
        <span id="sum-date-display" style="font-size: 13px; color: var(--text-sub);">Date: --</span>
      </div>

      <div class="budget-summary">
        <div>Destination: <span id="sum-city-display" style="color: #fff; font-weight:800;">--</span></div>
        <div>Total Cost: <span id="sum-total-display" style="color: var(--accent); font-weight:800;">$0</span></div>
      </div>

      <table class="summary-table">
        <thead>
          <tr>
            <th>Spot Name</th>
            <th>Category</th>
            <th>Cost</th>
          </tr>
        </thead>
        <tbody id="summary-table-body"></tbody>
      </table>

      <!-- Email Field -->
      <div class="form-group" style="margin-top: 28px;">
        <label>Email Briefing To:</label>
        <input type="email" id="email-address" placeholder="e.g. traveler@waypoint.com">
      </div>

      <div class="action-bar">
        <button class="btn btn-secondary" onclick="emailItinerary()">✉️ Email Itinerary</button>
        <button class="btn" onclick="downloadPDF()">📄 Download PDF Briefing</button>
      </div>
    </div>
  </div>

</div>

        { id: 'gc7', name: 'El Tovar Dining Room', desc: 'Historic lodge rustic steak dinner.', cost: 75, category: 'Dining' },
        { id: 'gc8', name: 'Hermit Road Bicycle Rental', desc: 'Scenic rim drive cycling.', cost: 40, category: 'Activity' },
        { id: 'gc9', name: 'Havasu Falls Helicopter', desc: 'Turquoise waterfalls in canyon floor.', cost: 180, category: 'Activity' },
        { id: 'gc10', name: 'Yavapai Geology Museum', desc: 'Educational exhibits overlooking rim.', cost: 0, category: 'Sight' },
        { id: 'gc11', name: 'Grand Canyon Railway Express', desc: 'Vintage train trip from Williams.', cost: 85, category: 'Activity' },
        { id: 'gc12', name: 'Grand Canyon IMAX Theater', desc: 'Giant screen canyon history film.', cost: 16, category: 'Sight' },
        { id: 'gc13', name: 'Desert View Trading Post', desc: 'Native American crafts & souvenirs.', cost: 35, category: 'Shopping' },
        { id: 'gc14', name: 'Bright Angel Lodge Tavern', desc: 'Casual saloon barbecue & cold beers.', cost: 30, category: 'Dining' },
        { id: 'gc15', name: 'Lipan Point Sunset Stroll', desc: 'Vibrant sunset colors on canyon rock.', cost: 0, category: 'Sight' },
        { id: 'gc16', name: 'Phantom Ranch Mule Trek', desc: 'Guided mule ride down canyon floor.', cost: 220, category: 'Activity' },
        { id: 'gc17', name: 'Tusayan General Store', desc: 'Local Southwestern gifts & trail gear.', cost: 25, category: 'Shopping' },
        { id: 'gc18', name: 'Ooh Aah Point Hike', desc: 'Short steep hike to breathtaking view.', cost: 0, category: 'Activity' },
        { id: 'gc19', name: 'Canyon Rim Grill Breakfast', desc: 'Hearty pancakes before early hike.', cost: 20, category: 'Dining' },
        { id: 'gc20', name: 'Navajo Artisan Market', desc: 'Handmade silver jewelry & rugs.', cost: 60, category: 'Shopping' }
      ]
    },
    {
      id: 'tokyo',
      name: 'Tokyo (Shinjuku & Shibuya)',
      country: 'Japan',
      places: [
        { id: 't1', name: 'Torien Yakitori', desc: 'Smoky skewers in lantern alleys.', cost: 45, category: 'Dining' },
        { id: 't2', name: 'Ichiran Ramen Counter', desc: 'Solo booth tonkotsu ramen.', cost: 18, category: 'Dining' },
        { id: 't3', name: 'Golden Gai Bar Crawl', desc: 'Explore historic micro-bars.', cost: 60, category: 'Nightlife' },
        { id: 't4', name: 'teamLab Planets', desc: 'Immersive digital art space.', cost: 38, category: 'Activity' },
        { id: 't5', name: 'Shibuya Sky Deck', desc: '360 degree city open-air view.', cost: 20, category: 'Sight' }
      ]
    }
  ];

  let currentCity = CITIES[0];
  let targetBudget = 1000;
  let plannedPlaces = [];
  let currentCategoryFilter = 'All';

  function init() {
    populateCitySelect();
    selectCityById(currentCity.id);
  }

  function populateCitySelect() {
    const sel = document.getElementById('location-select');
    sel.innerHTML = CITIES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  }

  function onCitySelectChange(cityId) {
    selectCityById(cityId);
  }

  function selectCityById(id) {
    currentCity = CITIES.find(c => c.id === id);
    plannedPlaces = JSON.parse(JSON.stringify(currentCity.places.slice(0, 4)));
    renderStep2();
    renderStep3();
    renderStep4();
  }

  function goToStep2() {
    targetBudget = parseFloat(document.getElementById('input-budget').value) || 0;
    renderStep2();
    showPage('step2');
  }

  function filterCategory(category, btn) {
    currentCategoryFilter = category;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderStep2();
  }

  function renderStep2() {
    document.getElementById('nearby-city-title').innerText = currentCity.name;
    const grid = document.getElementById('recommendations-grid');
    
    let filteredPlaces = currentCity.places;
    if (currentCategoryFilter !== 'All') {
      filteredPlaces = filteredPlaces.filter(p => p.category === currentCategoryFilter);
    }

    document.getElementById('spot-count-badge').innerText = `${filteredPlaces.length} Spots Available`;

    grid.innerHTML = filteredPlaces.map(place => {
      const isAdded = plannedPlaces.some(p => p.id === place.id);
      return `
        <div class="card ${isAdded ? 'selected' : ''}" onclick="togglePlaceFromRec('${place.id}')">
          <div>
            <h3>${place.name}</h3>
            <p>${place.desc}</p>
          </div>
          <div class="card-footer">
            <span class="badge-category">${place.category}</span>
            <span class="badge-cost">$${place.cost}</span>
          </div>
          <div style="font-size:12px; font-weight:800; color:${isAdded ? 'var(--accent)' : 'var(--text-sub)'}; margin-top:12px;">
            ${isAdded ? '✓ Added to Itinerary' : '+ Click to Select'}
          </div>
        </div>
      `;
    }).join('');
  }

  function togglePlaceFromRec(placeId) {
    const existsIndex = plannedPlaces.findIndex(p => p.id === placeId);
    if (existsIndex > -1) {
      plannedPlaces.splice(existsIndex, 1);
    } else {
      const orig = currentCity.places.find(p => p.id === placeId);
      if (orig) plannedPlaces.push(JSON.parse(JSON.stringify(orig)));
    }
    renderStep2();
    renderStep3();
    renderStep4();
  }

  function addCustomPlace() {
    const nameInput = document.getElementById('custom-name');
    const costInput = document.getElementById('custom-cost');
    const categoryInput = document.getElementById('custom-category');

    const name = nameInput.value.trim();
    const cost = parseFloat(costInput.value) || 0;
    const category = categoryInput.value;

    if (!name) return;

    const newPlace = {
      id: 'custom-' + Date.now(),
      name: name,
      desc: `User added spot`,
      cost: cost,
      category: category
    };

    plannedPlaces.push(newPlace);
    nameInput.value = '';
    renderStep3();
    renderStep4();
  }

  function removePlace(id) {
    plannedPlaces = plannedPlaces.filter(p => p.id !== id);
    renderStep2();
    renderStep3();
    renderStep4();
  }

  function updatePlaceCost(id, val) {
    const item = plannedPlaces.find(p => p.id === id);
    if (item) {
      item.cost = parseInt(val) || 0;
      document.getElementById(`badge-${id}`).innerText = `$${item.cost}`;
      calculateTotalBudget();
      renderStep4();
    }
  }

  function calculateTotalBudget() {
    const total = plannedPlaces.reduce((sum, item) => sum + item.cost, 0);
    document.getElementById('allocated-budget').innerText = `$${total}`;
    document.getElementById('target-budget-display').innerText = `$${targetBudget}`;

    const allocElem = document.getElementById('allocated-budget');
    if (total > targetBudget) {
      allocElem.style.color = '#ef4444';
    } else {
      allocElem.style.color = 'var(--accent)';
    }

    updatePrintSummary(total);
    return total;
  }

  function renderStep3() {
    const container = document.getElementById('planner-items-container');

    if (plannedPlaces.length === 0) {
      container.innerHTML = `<div style="font-size:14px; color:var(--text-sub); text-align:center; padding: 24px;">No spots selected yet. Go back to Step 2 to pick locations.</div>`;
      calculateTotalBudget();
      return;
    }

    container.innerHTML = plannedPlaces.map(item => `
      <div class="item-row">
        <div class="item-header">
          <span>${item.name} <small style="font-size:12px; color:var(--text-sub); font-weight:normal;">(${item.category || 'Spot'})</small></span>
          <div>
            <span class="val-badge" id="badge-${item.id}">$${item.cost}</span>
            <button class="btn-danger" style="margin-left:12px;" onclick="removePlace('${item.id}')">Remove</button>
          </div>
        </div>
        <div class="item-desc">${item.desc}</div>
        <div class="slider-row">
          <label>Adjust Cost Allocation:</label>
          <input type="range" min="0" max="500" step="5" value="${item.cost}" oninput="updatePlaceCost('${item.id}', this.value)">
        </div>
      </div>
    `).join('');

    calculateTotalBudget();
  }

  function renderStep4() {
    const tripDate = document.getElementById('trip-date').value;
    const total = plannedPlaces.reduce((sum, item) => sum + item.cost, 0);

    document.getElementById('sum-city-display').innerText = currentCity.name;
    document.getElementById('sum-date-display').innerText = `Date: ${tripDate}`;
    document.getElementById('sum-total-display').innerText = `$${total}`;

    const tableBody = document.getElementById('summary-table-body');
    if (plannedPlaces.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: var(--text-sub);">No spots selected.</td></tr>`;
      return;
    }

    tableBody.innerHTML = plannedPlaces.map(p => `
      <tr>
        <td><strong>${p.name}</strong><br><small style="color:var(--text-sub);">${p.desc}</small></td>
        <td><span class="badge-category">${p.category || 'Spot'}</span></td>
        <td style="color:var(--accent); font-weight:800;">$${p.cost}</td>
      </tr>
    `).join('');
  }

  function updatePrintSummary(total) {
    const tripDate = document.getElementById('trip-date').value;
    document.getElementById('p-title').innerText = `WAY POINT ADVISOR — ${currentCity.name} Briefing`;
    document.getElementById('p-date').innerText = `Scheduled Date: ${tripDate} | Target Budget: $${targetBudget}`;
    
    document.getElementById('p-content').innerHTML = `
      <table>
        <tr><th>Spot Name</th><th>Category</th><th>Cost</th></tr>
        ${plannedPlaces.map(p => `<tr><td>${p.name}</td><td>${p.category || 'Spot'}</td><td>$${p.cost}</td></tr>`).join('')}
        <tr><th colspan="2">Total Allocated Cost</th><th>$${total}</th></tr>
      </table>
    `;
  }

  function emailItinerary() {
    const email = document.getElementById('email-address').value.trim();
    const tripDate = document.getElementById('trip-date').value;
    const total = plannedPlaces.reduce((sum, item) => sum + item.cost, 0);

    let bodyText = `WAY POINT ADVISOR - Travel Itinerary\n\n`;
    bodyText += `Destination: ${currentCity.name}\n`;
    bodyText += `Trip Date: ${tripDate}\n`;
    bodyText += `Total Cost: $${total}\n\n`;
    bodyText += `Selected Locations:\n`;

    plannedPlaces.forEach((p, idx) => {
      bodyText += `${idx + 1}. ${p.name} (${p.category || 'Spot'}) - $${p.cost}\n`;
    });

    const subject = encodeURIComponent(`WayPoint Travel Briefing: ${currentCity.name}`);
    const body = encodeURIComponent(bodyText);

    window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
  }

  function downloadPDF() {
    window.print();
  }

  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));

    document.getElementById(`page-${pageId}`).classList.add('active');
    document.getElementById(`nav-${pageId}`).classList.add('active');

    if (pageId === 'step4') {
      renderStep4();
    }
  }

  window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
