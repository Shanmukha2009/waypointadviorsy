<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selection & Date Picker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9f9f9;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="date"] {
      padding: 8px 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
      box-sizing: border-box;
    }

    .spots-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .spot {
      padding: 12px;
      border: 1px solid #007bff;
      background-color: #fff;
      color: #007bff;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s, color 0.2s;
    }

    .spot:hover {
      background-color: #e6f0ff;
    }

    /* Highlighted state for selected spots */
    .spot.selected {
      background-color: #007bff;
      color: white;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-reset {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .btn-reset:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>

  <h2>Select Spots & Date</h2>

  <!-- Date Selection (Minimum date enforced in HTML) -->
  <div class="form-group">
    <label for="event-date">Select Date (2026 or later):</label>
    <input type="date" id="event-date" min="2026-01-01" value="2026-01-01">
  </div>

  <!-- Spot Selection Grid -->
  <div class="form-group">
    <label>Pick Your Spots:</label>
    <div class="spots-grid" id="spots-container">
      <div class="spot">Spot 1</div>
      <div class="spot">Spot 2</div>
      <div class="spot">Spot 3</div>
      <div class="spot">Spot 4</div>
      <div class="spot">Spot 5</div>
      <div class="spot">Spot 6</div>
    </div>
  </div>

  <!-- Reset Button -->
  <div class="actions">
    <button class="btn-reset" id="reset-btn">Reset All Selections</button>
  </div>

  <script>
    const dateInput = document.getElementById('event-date');
    const spots = document.querySelectorAll('.spot');
    const resetButton = document.getElementById('reset-btn');

    // 1. Prevent date from going earlier than 2026 manually
    dateInput.addEventListener('change', (e) => {
      const minDate = new Date('2026-01-01');
      const selectedDate = new Date(e.target.value);

      if (selectedDate < minDate || isNaN(selectedDate)) {
        alert("Dates prior to 2026 are not allowed.");
        e.target.value = '2026-01-01'; // Reset to min date
      }
    });

    // 2. Toggle spot selection on click
    spots.forEach(spot => {
      spot.addEventListener('click', () => {
        spot.classList.toggle('selected');
      });
    });

    // 3. Reset button functionality
    resetButton.addEventListener('click', () => {
      // Clear all selected spots
      spots.forEach(spot => spot.classList.remove('selected'));

      // Reset date to default min date (2026-01-01)
      dateInput.value = '2026-01-01';
    });
  </script>

</body>
</html>
