<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAY POINT ADVISOR — Minimalist Travel Planner</title>

<!-- Print Styles -->
<style media="print">
  body { background: #fff !important; color: #000 !important; font-family: sans-serif; }
  .no-print, nav, button, select, input { display: none !important; }
  .print-only { display: block !important; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
</style>

<!-- App Styles -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

  :root {
    --bg: #0a0c10;
    --panel: #12161f;
    --panel-border: #1e2638;
    --accent: #ffb400;
    --accent-soft: rgba(255, 180, 0, 0.12);
    --text: #f1f5f9;
    --text-sub: #94a3b8;
    --radius: 12px;
    --font: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.4;
    padding-bottom: 60px;
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Header & 5-Tab Navigation */
  header {
    border-bottom: 1px solid var(--panel-border);
    padding: 20px 0;
    margin-bottom: 24px;
  }

  .nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }

  .logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
  }

  .logo span { color: var(--accent); }

  nav {
    display: flex;
    gap: 4px;
    background: var(--panel);
    padding: 4px;
    border-radius: var(--radius);
    border: 1px solid var(--panel-border);
    flex-wrap: wrap;
  }

  nav button {
    background: transparent;
    color: var(--text-sub);
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  nav button:hover { color: #fff; }

  nav button.active {
    background: var(--accent);
    color: #000;
  }

  /* Control Strip */
  .control-strip {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .control-group label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-sub);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  select, input[type="date"], input[type="text"] {
    background: #05070a;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-family: var(--font);
    font-size: 13px;
    outline: none;
  }

  select:focus, input[type="date"]:focus, input[type="text"]:focus {
    border-color: var(--accent);
  }

  /* Page Views */
  .page { display: none; }
  .page.active { display: block; }

  /* Minimal Cards Grid */
  .grid-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.2s;
  }

  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }

  .card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
    background-color: #1a202c;
  }

  .card-body {
    padding: 16px;
  }

  .card-body h3 {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }

  .card-body p {
    font-size: 12px;
    color: var(--text-sub);
  }

  /* Panels & Rows */
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }

  .panel-title {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .item-row {
    background: #07090e;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }

  .item-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }

  .item-desc {
    font-size: 11px;
    color: var(--text-sub);
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  .slider-row label {
    font-size: 11px;
    color: var(--text-sub);
  }

  .slider-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .val-badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
  }

  /* Minimal Buttons */
  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-block;
    transition: opacity 0.2s;
  }

  .btn:hover { opacity: 0.9; }

  .print-only { display: none; }
</style>
</head>
<body>

<!-- Printable Summary Page -->
<div class="print-only">
  <h1 id="p-title">WAY POINT ADVISOR Briefing</h1>
  <p id="p-date"></p>
  <div id="p-content" style="margin-top: 20px;"></div>
</div>

<div class="container no-print">

  <!-- Header & 5 Navigation Tabs -->
  <header>
    <div class="nav-bar">
      <div class="logo">
        <span>📍</span> WAY POINT ADVISOR
      </div>
      <nav>
        <button id="nav-explore" class="active" onclick="showPage('explore')">1. Explore</button>
        <button id="nav-planner" onclick="showPage('planner')">2. Planning</button>
        <button id="nav-nearby" onclick="showPage('nearby')">3. Nearby</button>
        <button id="nav-budget" onclick="showPage('budget')">4. Budgeting</button>
        <button id="nav-summary" onclick="showPage('summary')">5. Summary</button>
      </nav>
    </div>
  </header>

  <!-- Location & Date Control Strip -->
  <div class="control-strip">
    <div class="control-group">
      <label>Destination:</label>
      <select id="location-select" onchange="selectCityById(this.value)">
        <!-- Populated dynamically -->
      </select>
    </div>
    <div class="control-group">
      <label>Trip Date:</label>
      <input type="date" id="trip-date" onchange="setDate(this.value)">
    </div>
  </div>

  <!-- PAGE 1: EXPLORE -->
  <div id="page-explore" class="page active">
    <div class="grid-cards" id="cards-grid"></div>
  </div>

  <!-- PAGE 2: PLANNING -->
  <div id="page-planner" class="page">
    <div class="panel">
      <div class="panel-title">Planned Dining & Night Activities</div>
      <div id="recs-container"></div>
      <div style="text-align: right; margin-top: 16px;">
        <button class="btn" onclick="showPage('nearby')">View Nearby Spots →</button>
      </div>
    </div>
  </div>

  <!-- PAGE 3: NEARBY ACTIVITIES SEARCH -->
  <div id="page-nearby" class="page">
    <div class="panel">
      <div class="panel-title">
        <span>Spots Near <span id="nearby-city-title">Destination</span></span>
      </div>
      <div style="margin-bottom: 16px;">
        <input type="text" id="nearby-search" placeholder="Search nearby spots..." oninput="filterNearby(this.value)" style="width: 100%;">
      </div>
      <div id="nearby-container"></div>
      <div style="text-align: right; margin-top: 16px;">
        <button class="btn" onclick="showPage('budget')">Go to Budgeting →</button>
      </div>
    </div>
  </div>

  <!-- PAGE 4: BUDGETING -->
  <div id="page-budget" class="page">
    <div class="panel">
      <div class="panel-title">
        <span>Activity Budget Allocator</span>
        <span id="total-budget" style="color: var(--accent);">$0</span>
      </div>
      <div id="budget-container"></div>
      <div style="text-align: right; margin-top: 16px;">
        <button class="btn" onclick="showPage('summary')">View Summary →</button>
      </div>
    </div>
  </div>

  <!-- PAGE 5: SUMMARY -->
  <div id="page-summary" class="page">
    <div class="panel">
      <div class="panel-title">
        <span id="sum-city">Selected City</span>
        <span id="sum-date" style="font-size: 12px; color: var(--text-sub);">Date: --</span>
      </div>
      <p style="font-size: 13px; color: var(--text-sub);" id="sum-desc"></p>
    </div>

    <div class="panel">
      <div class="panel-title">
        <span>Allocated Itinerary Breakdown</span>
        <span id="sum-total" style="color: var(--accent);">$0</span>
      </div>
      <div id="sum-list"></div>
    </div>

    <div style="text-align: center;">
      <button class="btn" onclick="window.print()">🖨️ Print Briefing</button>
    </div>
  </div>

</div>

  let currentCity = CITIES[0];
  let tripDate = '2026-10-15';
  let budgetMap = {};

  function init() {
    populateSelect();
    renderCards();
    document.getElementById('trip-date').value = tripDate;
    selectCityById(currentCity.id);
  }

  function populateSelect() {
    const sel = document.getElementById('location-select');
    sel.innerHTML = CITIES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  }

  function renderCards() {
    const grid = document.getElementById('cards-grid');
    grid.innerHTML = CITIES.map(c => `
      <div class="card ${c.id === currentCity.id ? 'selected' : ''}" onclick="selectCityById('${c.id}')">
        <img src="${c.img}" alt="${c.name}" loading="lazy">
        <div class="card-body">
          <h3>${c.name}</h3>
          <p>${c.desc}</p>
        </div>
      </div>
    `).join('');
  }

  function selectCityById(id) {
    currentCity = CITIES.find(c => c.id === id);
    document.getElementById('location-select').value = id;

    [...currentCity.eats, ...currentCity.activities].forEach(item => {
      if (!(item.id in budgetMap)) budgetMap[item.id] = item.cost;
    });

    renderCards();
    renderPlanner();
    renderNearby();
    renderBudget();
    updateSummary();
  }

  function setDate(val) {
    tripDate = val;
    updateSummary();
  }

  function renderPlanner() {
    const recs = document.getElementById('recs-container');
    const items = [...currentCity.eats, ...currentCity.activities];
    
    recs.innerHTML = items.map(i => `
      <div class="item-row">
        <div class="item-header">
          <span>${i.name}</span>
          <span class="val-badge">$${budgetMap[i.id]}</span>
        </div>
        <div class="item-desc">${i.desc}</div>
      </div>
    `).join('');
  }

  function renderNearby(filterQuery = '') {
    document.getElementById('nearby-city-title').innerText = currentCity.name;
    const container = document.getElementById('nearby-container');
    
    let spots = currentCity.nearby;
    if (filterQuery) {
      spots = spots.filter(s => s.name.toLowerCase().includes(filterQuery.toLowerCase()) || s.desc.toLowerCase().includes(filterQuery.toLowerCase()));
    }

    if (spots.length === 0) {
      container.innerHTML = `<div style="font-size:12px; color:var(--text-sub);">No matching nearby spots found.</div>`;
      return;
    }

    container.innerHTML = spots.map(n => `
      <div class="item-row">
        <div class="item-header">
          <span>${n.name}</span>
        </div>
        <div class="item-desc">${n.desc}</div>
      </div>
    `).join('');
  }

  function filterNearby(query) {
    renderNearby(query);
  }

  function renderBudget() {
    const container = document.getElementById('budget-container');
    const items = [...currentCity.eats, ...currentCity.activities];

    container.innerHTML = items.map(i => `
      <div class="item-row">
        <div class="item-header">
          <span>${i.name}</span>
          <span class="val-badge" id="badge-${i.id}">$${budgetMap[i.id]}</span>
        </div>
        <div class="slider-row">
          <label>Budget:</label>
          <input type="range" min="0" max="200" step="5" value="${budgetMap[i.id]}" oninput="updateCost('${i.id}', this.value)">
        </div>
      </div>
    `).join('');

    calcTotal();
  }

  function updateCost(id, val) {
    budgetMap[id] = parseInt(val);
    document.getElementById(`badge-${id}`).innerText = `$${val}`;
    calcTotal();
    renderPlanner();
    updateSummary();
  }

  function calcTotal() {
    const items = [...currentCity.eats, ...currentCity.activities];
    const total = items.reduce((sum, i) => sum + (budgetMap[i.id] || 0), 0);
    document.getElementById('total-budget').innerText = `$${total}`;
    return total;
  }

  function updateSummary() {
    document.getElementById('sum-city').innerText = currentCity.name;
    document.getElementById('sum-date').innerText = `Date: ${tripDate || 'Not set'}`;
    document.getElementById('sum-desc').innerText = currentCity.desc;

    const total = calcTotal();
    document.getElementById('sum-total').innerText = `$${total}`;

    const items = [...currentCity.eats, ...currentCity.activities];
    document.getElementById('sum-list').innerHTML = items.map(i => `
      <div class="item-row" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:13px; font-weight:600; color:#fff;">${i.name}</div>
          <div style="font-size:11px; color:var(--text-sub);">${i.desc}</div>
        </div>
        <div class="val-badge">$${budgetMap[i.id]}</div>
      </div>
    `).join('');

    document.getElementById('p-title').innerText = `WAY POINT ADVISOR — ${currentCity.name} Briefing`;
    document.getElementById('p-date').innerText = `Scheduled Date: ${tripDate}`;
    document.getElementById('p-content').innerHTML = `
      <table>
        <tr><th>Activity / Venue</th><th>Allocated Budget</th></tr>
        ${items.map(i => `<tr><td>${i.name}</td><td>$${budgetMap[i.id]}</td></tr>`).join('')}
        <tr><th>Total Budget</th><th>$${total}</th></tr>
      </table>
    `;
  }

  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));

    document.getElementById(`page-${pageId}`).classList.add('active');
    document.getElementById(`nav-${pageId}`).classList.add('active');
  }

  window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
